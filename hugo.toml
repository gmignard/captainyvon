baseURL = "https://captainyvon.fr/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"
title = "Captain Yvon Studio"
timeZone = "Europe/Paris"
enableRobotsTXT = true
enableEmoji = false
disableKinds = ["taxonomy", "term", "rss"]

[pagination]
  pagerSize = 100

[[menus.main]]
  name = "Work"
  url = "/"
  weight = 10
  [menus.main.params]
    accueil = true
    prefixes = ["/work/"]

[[menus.main]]
  name = "Studio"
  url = "/studio/"
  weight = 20

[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 30

# Garde-fou de date, pas une source de verite : si un projet n'a pas de
# `date` exploitable dans son entete, Hugo retombe sur la date de
# modification du fichier plutot que sur la date zero. Les projets encore
# marques `date: 0000-00-00` sont donc dates par ce repli : les gabarits
# detectent le marqueur sur .Params.date pour ne pas afficher une annee
# inventee.
[frontmatter]
  date = ["date", ":fileModTime", ":default"]

[params]
  description = "Captain Yvon Studio, duo de réalisateurs et photographes entre Brest et Lille."
  logo = "img/logo-captainyvon-noir.svg"
  logoAlt = "Captain Yvon Studio"
  # Dimensions intrinseques du fichier logo, pour eviter tout decalage de mise en page.
  logoLargeur = 220
  logoHauteur = 36
  ogImageDefaut = "img/og-defaut.jpg"
  email = "studio@captainyvon.fr"
  lieu = "Brest et Lille"

[[params.social]]
  nom = "Instagram"
  url = "https://www.instagram.com/captainyvon/"
  icone = "instagram"

[[params.social]]
  nom = "YouTube"
  url = "https://www.youtube.com/captainyvon"
  icone = "youtube"

[[params.social]]
  nom = "LinkedIn"
  url = "https://www.linkedin.com/company/captainyvon/"
  icone = "linkedin"

# Cache des images retraitées par Hugo.
# Choix retenu : cache hors du dépôt, dans le répertoire de cache Hugo.
# Sur Netlify, :cacheDir pointe vers /opt/build/cache/hugo_cache, qui est
# conservé entre deux builds : les vignettes des projets ne sont retraitées
# que lorsque le fichier source change. C'est la stratégie recommandée par
# la documentation Hugo pour Netlify, et elle laisse resources/ ignoré par
# git (cf. .gitignore), donc aucune image générée n'est versionnée.
# L'alternative — versionner resources/_gen/ — est écartée : sur un
# portfolio d'une vingtaine de projets photo et vidéo, elle ferait grossir
# le dépôt de binaires régénérables et provoquerait des conflits à chaque
# changement de dimension ou de qualité.
[caches.images]
  dir = ':cacheDir/images'

[imaging]
  quality = 82
  resampleFilter = "Lanczos"
  hint = "photo"
  [imaging.exif]
    disableDate = true
    disableLatLong = true

[markup.goldmark.renderer]
  unsafe = false

[minify]
  minifyOutput = true

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
