# Donnees propres au pied de page.
#
# Ce fichier ne contient que ce que hugo.toml ne porte pas deja : l'adresse
# e-mail, le lieu et les reseaux sociaux viennent de [params] et ne sont pas
# repetes ici. L'annee de fondation est ecrite en dur dans le partial, avec
# l'annee courante generee au build.

# Logo en version claire, pose sur la bande noire. Chemin resolu depuis
# assets/. Tant que le fichier n'est pas dans le depot, le pied replie sur
# un logo texte : rien n'est telecharge ni invente.
logo_clair: "img/logo-captainyvon-blanc.svg"

# Premiere ligne du bloc d'identite. La suivante vient de params.lieu.
activite: "Studio de réalisation et de photographie"

# Collectif de representation. Le libelle encadre le nom, qui porte le lien.
collectif:
  intro: "Représenté par le collectif"
  nom: "AUNORD"
  url: "https://aunord.fr"

# Podcast du studio, en une ligne discrete sous les coordonnees.
podcast:
  nom: "Slow is Beautiful"
  mention: "notre podcast"
  url: "https://slowisbeautiful.substack.com/"
