# Donnees propres au pied de page.
#
# Ce fichier ne contient que ce que hugo.toml ne porte pas deja : l'adresse
# e-mail et les reseaux sociaux viennent de [params] et ne sont pas repetes
# ici. L'annee de fondation est ecrite en dur dans le partial, avec l'annee
# courante generee au build.

# Logo en version claire, pose sur la bande noire. Chemin resolu depuis
# assets/. Tant que le fichier n'est pas dans le depot, le pied replie sur
# un logo texte : rien n'est telecharge ni invente.
logo_clair: "img/logo-captainyvon-blanc.svg"

# Premiere ligne de la colonne de discours, en capitales comme la ligne du
# collectif qui la suit.
activite: "Réalisation de films et reportages photos"

# Phrase de presentation, posee sous la ligne d'activite. Casse normale,
# corps legerement inferieur : c'est une phrase, pas un libelle.
presentation: "Deux réalisateurs, amis avant tout, passionnés par les histoires authentiques et le plein air. Guidés par une approche documentaire et un style intemporel."

# Collectif de representation. Le libelle encadre le nom, qui porte le lien.
collectif:
  intro: "Représenté par le collectif"
  nom: "AUNORD"
  url: "https://aunord.fr"
