# Déploiement Netlify — Captain Yvon Studio
# La version de Hugo est épinglée sur celle utilisée pour construire le site.
# Vérifier avec `hugo version` avant de la changer.

# Netlify expose URL comme adresse principale du projet : le sous-domaine
# .netlify.app aujourd'hui, captainyvon.fr une fois le domaine personnalisé
# défini comme principal. Passer --baseURL "${URL}" évite donc tout commit
# le jour de la bascule DNS.
[build]
  publish = "public"
  command = 'hugo --gc --minify --baseURL "${URL}"'

[build.environment]
  HUGO_VERSION = "0.148.2"
  TZ = "Europe/Paris"

# Les previews de branche et de PR sont construites sur leur propre URL,
# sinon les URLs absolues (canonical, Open Graph) pointeraient vers la prod.
#
# La preview de PR construit en plus les brouillons, avec --buildDrafts : c'est
# ce qui rend les fiches de recette de content/work/zz-recette-* consultables
# pendant une relecture. Ces fiches déclarent `_build.list: never` dans leur
# entête : elles sont servies à leur adresse mais n'entrent dans aucune
# collection, donc ni sitemap, ni flux, ni liste des projets de l'accueil.
#
# La production, elle, n'a PAS de bloc [context.production] : elle utilise la
# commande de [build] ci-dessus, sans --buildDrafts. Un contexte ne déborde
# jamais sur un autre chez Netlify, et l'option ajoutée ici ne concerne donc
# que les deploy previews. Ne pas ajouter --buildDrafts ailleurs.
[context.deploy-preview]
  command = "hugo --gc --minify --buildDrafts --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    # PRÉPROD — à retirer le jour de la bascule DNS (20 septembre 2026).
    # Empêche l'indexation de captainyvon.netlify.app tant que le site n'est
    # pas officiellement en ligne. Les headers de netlify.toml sont globaux :
    # ne pas tenter de surcharge par contexte, elle fuiterait en production.
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Feuille de style passée au fingerprint sha256 par Hugo Pipes, donc immuable.
# Chemin vérifié après build local : /css/main.min.<sha256>.css
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
