# Déploiement Netlify — Captain Yvon Studio
# La version de Hugo est épinglée sur celle utilisée pour construire le site.
# Vérifier avec `hugo version` avant de la changer.

# Netlify expose URL comme adresse principale du projet : le sous-domaine
# .netlify.app aujourd'hui, captainyvon.fr une fois le domaine personnalisé
# défini comme principal. Passer --baseURL "${URL}" évite donc tout commit
# le jour de la bascule DNS.
[build]
  publish = "public"
  command = 'hugo --gc --minify --baseURL "${URL}"'

[build.environment]
  HUGO_VERSION = "0.148.2"
  TZ = "Europe/Paris"

# Les previews de branche et de PR sont construites sur leur propre URL,
# sinon les URLs absolues (canonical, Open Graph) pointeraient vers la prod.
[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    # PRÉPROD — à retirer le jour de la bascule DNS (20 septembre 2026).
    # Empêche l'indexation de captainyvon.netlify.app tant que le site n'est
    # pas officiellement en ligne. Les headers de netlify.toml sont globaux :
    # ne pas tenter de surcharge par contexte, elle fuiterait en production.
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Feuille de style passée au fingerprint sha256 par Hugo Pipes, donc immuable.
# Chemin vérifié après build local : /css/main.min.<sha256>.css
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
