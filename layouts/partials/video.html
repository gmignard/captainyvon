{{- /*
  Lecteur video en facade.

  L'image de couverture EST le lecteur : elle est le contenu d'un
  <button type="button"> qui, au clic, se remplace par l'iframe de la
  plateforme en autoplay. Une pastille de lecture est posee au centre pour
  que la couverture se lise comme une video et non comme une photo : sans
  elle, rien ne distinguait ce bloc des autres images de la page. C'est le
  seul habillage, il n'y a ni voile, ni degrade, ni cartouche, et le survol
  se limite a un changement d'opacite defini dans la feuille de style.

  La pastille n'apparait que si le script a pu s'executer : c'est lui qui
  pose la classe `video-prete`. Sans JavaScript, le bouton serait inerte et
  la pastille promettrait une lecture qui n'arriverait pas, le <noscript>
  prend alors seul le relais.

  Un seul element cliquable : le bouton. Le nom accessible vient de son
  aria-label, l'image et la pastille portent donc respectivement un alt vide
  et aria-hidden pour ne rien annoncer deux fois.

  Un seul clic lance la lecture, sur tous les navigateurs. Deux conditions le
  garantissent.

  D'abord l'iframe est creee dans le gestionnaire de clic, et son attribut
  `allow` est pose avant son `src` : la politique de permissions est lue a la
  creation du contexte de navigation, la renseigner apres la ferait perdre.

  Ensuite le demarrage est muet. Firefox et Safari bloquent par defaut toute
  lecture automatique avec son dans une iframe tierce, quoi que delegue la
  page d'accueil : sans `mute`, ces navigateurs affichent le lecteur arrete et
  reclament un second clic. Le demarrage muet est le seul qui parte partout du
  premier coup. Le spectateur retablit le son avec l'icone de volume du
  lecteur, sans que le site ait a piloter la plateforme.

  playsinline evite en prime le passage force en plein ecran sur iOS.

  Aucune requete vers un domaine tiers avant le clic : ni iframe, ni script
  distant, ni vignette hebergee par la plateforme. Le poster est la
  couverture du page bundle, traitee par Hugo.

  Sans JavaScript, le bouton est inerte : le <noscript> fournit alors un lien
  direct vers la plateforme, portant le meme libelle. Ce lien n'existe jamais
  en meme temps que le bouton actif.
*/ -}}
{{- $page := . -}}
{{- with .Params.video -}}
  {{- $id := .id -}}
  {{- if $id -}}
    {{- $plateforme := lower (.plateforme | default "youtube") -}}

    {{- /* Ratio du lecteur, repli sur 16/9 si le champ est vide ou absent. */ -}}
    {{- $ratio := .ratio -}}
    {{- if not $ratio }}{{ $ratio = "16:9" }}{{ end -}}
    {{- $ratioCSS := replace (replace $ratio ":" " / ") "x" " / " -}}

    {{- $embed := "" -}}
    {{- $direct := "" -}}
    {{- if eq $plateforme "vimeo" -}}
      {{- $embed = printf "https://player.vimeo.com/video/%s?dnt=1&autoplay=1&muted=1&playsinline=1" $id -}}
      {{- $direct = printf "https://vimeo.com/%s" $id -}}
    {{- else -}}
      {{- $embed = printf "https://www.youtube-nocookie.com/embed/%s?autoplay=1&mute=1&playsinline=1&rel=0" $id -}}
      {{- $direct = printf "https://www.youtube.com/watch?v=%s" $id -}}
    {{- end -}}

    {{- $titre := $page.Title -}}
    {{- if not $titre }}{{ with $page.File }}{{ $titre = humanize .ContentBaseName }}{{ end }}{{ end -}}
    {{- $libelle := printf "Lire la vidéo, %s" $titre -}}

    {{- $couverture := partial "couverture.html" $page -}}
    {{- $poster := "" -}}
    {{- with $couverture -}}
      {{- $l := cond (gt .Width 1600) 1600 .Width -}}
      {{- $poster = .Resize (printf "%dx webp q82" $l) -}}
    {{- end }}

<div class="video" style="{{ printf "--ratio: %s;" $ratioCSS | safeCSS }}">
  <button type="button" class="video-declencheur"
          data-embed="{{ $embed }}"
          data-titre="{{ printf "%s, %s" $titre site.Title }}"
          aria-label="{{ $libelle }}">
    {{- with $poster }}
    <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}"
         alt="" loading="eager" decoding="async">
    {{- end }}
    <span class="video-lecture" aria-hidden="true"></span>
  </button>
</div>

<noscript>
  <p class="video-repli"><a href="{{ $direct }}" rel="noopener">{{ $libelle }}</a></p>
</noscript>

<script>
document.querySelectorAll('.video-declencheur').forEach(function (b) {
  var hote0 = b.closest('.video');
  if (hote0) { hote0.classList.add('video-prete'); }
  b.addEventListener('click', function () {
    var src = b.getAttribute('data-embed');
    var hote = b.closest('.video');
    if (!src || !hote) { return; }
    var f = document.createElement('iframe');
    /* allow est pose AVANT src, et src en dernier : la politique de
       permissions est lue a la creation du contexte de navigation, et c'est
       elle qui delegue l'autorisation d'autoplay a la plateforme. Renseigner
       src en premier fait perdre la delegation sur certains navigateurs, donc
       le second clic. */
    f.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    f.title = b.getAttribute('data-titre') || 'Vidéo';
    f.src = src;
    hote.replaceChildren(f);
  });
});
</script>
  {{- end -}}
{{- end -}}
